[/Script/StacktownAlpha.StacktownRuntime]
; PHASE B SWITCH (owner's word "flip it", 2026-09-06): the Python economy and
; click drivers no longer register in game processes; UStacktownCitySync owns
; the city, reading and writing Saved/Stacktown/<state>.json (migrated once from
; Content/Python). Set true to fall back to the Python drivers.
bPythonDrivers=false

[/Script/UnrealEd.ProjectPackagingSettings]
; the economy rules ride in the pak (2026-09-06); Config/ subfolders would not be staged
+DirectoriesToAlwaysStageAsUFS=(Path="Stacktown/Rules")
; The C++ game loads its assets BY PATH (the catalogue's masses, the ghost pad and
; ghost materials, the species instances, the selection outline, the night
; collection), so nothing in the map references them and the cooker would drop
; them. Found 2026-09-06: the packaged app had no ghost pad and no outline.
+DirectoriesToAlwaysCook=(Path="/Game/Stacktown/BakedWood")
+DirectoriesToAlwaysCook=(Path="/Game/Stacktown/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/Stacktown/UI")
+DirectoriesToAlwaysCook=(Path="/Game/Stacktown/Audio")
; Native Metal shader libraries (2026-09-06 night): without them the cooked app compiles
; every shader from bytecode on its first launch after any material change - a full core
; for 10+ minutes with a black window (packaged 22:17, log silent after the font server).
; With them the cook runs the Metal toolchain and the app opens in seconds.
bShareMaterialShaderCode=True
bSharedMaterialNativeLibraries=True
