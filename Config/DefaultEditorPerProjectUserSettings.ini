[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
ServerUrlPath=/mcp
ServerPortNumber=8000
bAutoStartServer=True
bEnableToolSearch=True

; Auto-reimport (2026-09-03): the engine default monitors all of /Game/ with
; only Localization/* excluded, so every JSON under Content/Python - the
; owner's citystate.json (rewritten every economy tick), the lane test state,
; econrules.json, genbuild_identity.json, study_pose.json and any self-test
; artifact - was a DataTable reimport waiting to fire. It fired three times
; and on the third the editor stalled on a prompt (HANDOFF.md section 5).
; The engine entry is removed and replaced with the same monitor plus two
; exclusions; wildcard entries exclude by default (bInclude=false).
[/Script/UnrealEd.EditorLoadingSavingSettings]
-AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint=,Wildcards=((Wildcard="Localization/*")))
+AutoReimportDirectorySettings=(SourceDirectory="/Game/",MountPoint=,Wildcards=((Wildcard="Localization/*"),(Wildcard="Python/*"),(Wildcard="*.json")))
